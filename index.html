<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USA LIFE 🇺🇸</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🇺🇸 USA<span>LIFE</span>
        </div>

        <nav>
            <a href="#">Асосӣ</a>
            <a href="#">Шаҳрҳо</a>
            <a href="#">Муқоиса</a>
            <a href="#">AI Assistant</a>
        </nav>

        <button class="menu-btn">☰</button>

    </header>


    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="subtitle">🇺🇸 DISCOVER AMERICA</p>

                <h1>
                    Шаҳри худро дар
                    <span>Амрико</span> ёб.
                </h1>

                <p class="description">
                    Шаҳрҳои ИМА-ро омӯз, муқоиса кун
                    ва ҷойеро пайдо кун, ки ба ту мувофиқ аст.
                </p>


                <div class="search-box">

                    <span>🔍</span>

                    <input
    type="text"
    id="cityInput"
    placeholder="Шаҳрро ҷустуҷӯ кун..."
>

<button id="searchButton">
    Ҷустуҷӯ
</button>
        

                </div>


                <div class="hero-buttons">

                    <button class="primary-btn">
                        Explore USA →
                    </button>

                    <button class="secondary-btn">
                        🤖 AI City Match
                    </button>

                </div>

            </div>

        </section>


        <section class="cities">

            <div class="section-title">
                <p>POPULAR DESTINATIONS</p>

                <h2>
                    Шаҳрҳои машҳур
                </h2>
            </div>


            <div class="city-grid">

                <div class="city-card">
                    <div class="city-image new-york"></div>

                    <div class="city-info">
                        <h3>New York 🗽</h3>
                        <p>New York, USA</p>
                    </div>
                </div>


                <div class="city-card">
                    <div class="city-image miami"></div>

                    <div class="city-info">
                        <h3>Miami 🌴</h3>
                        <p>Florida, USA</p>
                    </div>
                </div>


                <div class="city-card">
                    <div class="city-image los-angeles"></div>

                    <div class="city-info">
                        <h3>Los Angeles 🌴</h3>
                        <p>California, USA</p>
                    </div>
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
